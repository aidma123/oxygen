name: Delete branch

# Run from the Actions tab (or ask Claude to trigger it) to delete a branch.
# The default branch can never be deleted by this workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Exact name of the branch to delete"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="${BRANCH#refs/heads/}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to delete '$BRANCH' (it is empty or the default branch)."
            exit 1
          fi
          if ! gh api "repos/$REPO/branches/$BRANCH" --silent 2>/dev/null; then
            echo "::error::Branch '$BRANCH' does not exist."
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "Deleted branch '$BRANCH'."
          echo "Deleted branch \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

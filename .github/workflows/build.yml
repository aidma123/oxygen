name: Build oxygen browser

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: oxygen-windows-x64
          path: desktop/target/release/oxygen.exe

  ios:
    name: iOS (.ipa, unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: >
          xcodebuild -project Oxygen.xcodeproj -scheme Oxygen -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Oxygen.app Payload/
          zip -qry oxygen.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: oxygen-ios-unsigned
          path: ios/oxygen.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir release
          cp dist/oxygen-windows-x64/oxygen.exe release/oxygen-windows-x64.exe
          cp dist/oxygen-ios-unsigned/oxygen.ipa release/oxygen-ios-unsigned.ipa
          cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: oxygen ${{ inputs.version || github.ref_name }}
          files: release/*
          body: |
            ## Downloads

            - **Windows:** `oxygen-windows-x64.exe`. Needs the WebView2 Runtime, which comes with Windows 10 and 11. The file isn't code-signed, so SmartScreen may warn; choose **More info → Run anyway**.
            - **iOS:** `oxygen-ios-unsigned.ipa`. Unsigned; install with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) using your Apple ID. With a free Apple ID it has to be re-signed every 7 days.

            ## Features

            Vertical tab sidebar, workspaces, Essentials, pinned tabs, split view, compact mode, Glance link previews, built-in ad and tracker blocking, and session restore.

            ## Memory

            Background tabs are suspended and then unloaded. On Windows, a watchdog keeps the browser and all of its WebView2 processes under a RAM budget (800 MB by default, adjustable in Settings). On iOS, a loaded-tab limit does the same job, and background tabs are also unloaded when iOS sends a memory warning.

            This is the first release. It has been compiled and tested in CI, but not yet run on real Windows or iOS hardware.

[package]
name = "zenlite"
version = "0.1.0"
edition = "2021"
description = "A lightweight, Zen-style browser built on the system webview"
license = "MIT"

[dependencies]
wry = "0.57"
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
dirs = "7"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

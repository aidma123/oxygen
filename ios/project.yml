name: Oxygen
options:
  bundleIdPrefix: com.oxygen
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Oxygen:
    type: application
    platform: iOS
    sources:
      - path: Oxygen
      # The sidebar, page scripts and font are shared with the Windows app.
      - path: ../desktop/src/ui.html
        buildPhase: resources
      - path: ../desktop/src/content.js
        buildPhase: resources
      - path: ../desktop/src/glance.js
        buildPhase: resources
      - path: ../desktop/src/keybinds.json
        buildPhase: resources
      - path: ../desktop/assets/fonts/JetBrainsMono-latin.woff2
        buildPhase: resources
    scheme: {}
    info:
      path: Oxygen/Info.plist
      properties:
        CFBundleDisplayName: oxygen
        UIAppFonts:
          - JetBrainsMono.ttf
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxygen.browser
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
